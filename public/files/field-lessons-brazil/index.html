<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A few lessons from recent field campaigns in Brazil · Time2Graze Brazil Workshop</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0f1a15;color:#f5f6f2;font:14px/1.3 Manrope,system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:pan-y}
  #stage img{width:100%;height:100%;object-fit:contain;display:block}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 16px;
       background:rgba(15,26,21,.82);transition:opacity .3s}
  body.idle #bar{opacity:0;pointer-events:none}
  body.idle{cursor:none}
  #bar a,#bar button{color:#f5f6f2;background:none;border:1px solid rgba(245,246,242,.35);border-radius:6px;
       padding:6px 12px;font:inherit;cursor:pointer;text-decoration:none}
  #bar button:hover,#bar a:hover{background:rgba(220,232,155,.18)}
  #count{margin-left:auto;font-variant-numeric:tabular-nums}
  #progress{position:fixed;left:0;top:0;height:3px;background:#dce89b;transition:width .2s}
  body.idle #progress{opacity:0}
</style>
</head>
<body>
<div id="progress"></div>
<div id="stage"><img id="slide" alt=""></div>
<div id="bar">
  <a href="../../programme/#d3-state-of-the-art">Back to programme</a>
  <button id="prev" aria-label="Previous slide">←</button>
  <button id="next" aria-label="Next slide">→</button>
  <button id="fs">Full screen</button>
  <a href="deck.pdf" download>PDF</a>
  <span id="count"></span>
</div>
<script>
  const TOTAL = 29;
  const src = n => 'slides/' + String(n).padStart(2, '0') + '.webp';
  const img = document.getElementById('slide');
  let n = Math.min(TOTAL, Math.max(1, parseInt(location.hash.slice(1)) || 1));

  function show(k) {
    n = Math.min(TOTAL, Math.max(1, k));
    img.src = src(n);
    img.alt = 'Slide ' + n + ' of ' + TOTAL;
    document.getElementById('count').textContent = n + ' / ' + TOTAL;
    document.getElementById('progress').style.width = (n / TOTAL * 100) + '%';
    history.replaceState(null, '', '#' + n);
    // Preload neighbours so the next click is instant.
    [n + 1, n + 2, n - 1].forEach(j => { if (j >= 1 && j <= TOTAL) new Image().src = src(j); });
  }

  function toggleFs() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }

  document.getElementById('prev').onclick = e => { e.stopPropagation(); show(n - 1); };
  document.getElementById('next').onclick = e => { e.stopPropagation(); show(n + 1); };
  document.getElementById('fs').onclick = e => { e.stopPropagation(); toggleFs(); };
  document.getElementById('stage').onclick = e => show(e.clientX < innerWidth / 3 ? n - 1 : n + 1);

  addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(n + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(n - 1); }
    else if (e.key === 'Home') show(1);
    else if (e.key === 'End') show(TOTAL);
    else if (e.key === 'f' || e.key === 'F') toggleFs();
  });

  let x0 = null;
  addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) show(dx < 0 ? n + 1 : n - 1);
  });

  let t;
  function wake() { document.body.classList.remove('idle'); clearTimeout(t); t = setTimeout(() => document.body.classList.add('idle'), 2500); }
  addEventListener('mousemove', wake); addEventListener('keydown', wake); addEventListener('touchstart', wake, { passive: true });

  show(n); wake();
</script>
</body>
</html>
